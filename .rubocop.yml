require:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0
  Exclude:
    - "db/schema.rb"
    - "bin/**/*"
    - "vendor/**/*"
    # Migrations do Solid Queue: são o schema da gem copiado para cá (ver
    # o comentário em CreateSolidQueueTables), não código deste projeto.
    # Reformatá-las para o nosso estilo faria o próximo
    # `bin/rails solid_queue:update` virar um conflito a resolver à mão,
    # e o ganho seria zero — ninguém edita esses arquivos. Mesmo critério
    # do db/schema.rb acima. As migrations escritas por nós continuam
    # sendo checadas normalmente.
    - "db/migrate/*_solid_queue*.rb"

# O projeto documenta decisões em comentários contextuais (o "porquê" de
# cada escolha), não em RDoc por classe — exigir um comentário fixo de
# classe não agregaria valor real aqui, só ruído para satisfazer a cop.
Style/Documentation:
  Enabled: false

# Alguns nomes de método/variável em português (ex.:
# zerar_notificacao_de_atraso_se_nao_esta_mais_atrasada) ficam mais longos
# que o padrão de 120 colunas; 130 dá folga sem abrir mão do limite.
Layout/LineLength:
  Max: 130

# A suíte tem vários "it" que verificam mais de um aspecto relacionado da
# mesma resposta (ex.: status da resposta + efeito no banco) — é um
# estilo válido para request specs deste projeto, não teste mal desenhado.
RSpec/MultipleExpectations:
  Enabled: false

RSpec/ExampleLength:
  Max: 20

RSpec/NestedGroups:
  Max: 4

# telegram_notifier_spec precisa de vários dublês (chat/mensagem/documento,
# request de sucesso e de falha) pra cobrir #notify_atraso e
# #enviar_documento sem gem de mock de HTTP (ver comentário no topo do
# arquivo) — nenhum deles é redundante, só refletem os vários parâmetros
# reais do TelegramNotifier.
RSpec/MultipleMemoizedHelpers:
  Max: 9

# Os únicos "context" do projeto descrevem o papel do usuário em português
# ("quando o usuário é líder/executor") — o projeto todo é em pt-BR (ver
# comentários por toda a app), então os prefixos padrão em inglês
# (when/with/without) nunca vão bater aqui.
RSpec/ContextWording:
  Prefixes:
    - quando
    - com
    - sem

# spec/tasks cobre uma rake task (não uma classe) — RSpec.describe
# recebendo uma string é o padrão usual pra isso, não há classe pra passar.
# O before(:all) ali só chama Rails.application.load_tasks (carregar as
# tasks é caro e não teria por que rodar de novo antes de cada teste) — não
# cria nenhum estado/registro que possa vazar entre exemplos.
RSpec/DescribeClass:
  Exclude:
    - "spec/tasks/**/*"

RSpec/BeforeAfterAll:
  Exclude:
    - "spec/tasks/**/*"

# Specs às vezes precisam forçar um valor de campo (ex.: updated_at) sem
# disparar validações/callbacks, pra simular o estado de um registro
# antigo — não é um code smell aqui, é a única forma de testar isso.
# lib/tasks: marcar atraso_notificado_em após notificar é só um bookmark
# interno; usar update! reexecutaria validações à toa (a demanda já foi
# validada quando foi criada/atualizada) só pra tocar updated_at.
Rails/SkipsModelValidations:
  Exclude:
    - "spec/**/*"
    - "lib/tasks/**/*"

# App de locale único (pt-BR, ver config/application.rb), sem seletor de
# idioma — config/locales só existe pra suprir traduções que faltam no
# Devise/Rails em si (ver comentário no topo do arquivo), não pra strings
# da aplicação. Textos fixos em português nos controllers são consistentes
# com o resto do app (views já são todas em pt-BR direto, sem chave de
# tradução).
Rails/I18nLocaleTexts:
  Enabled: false

# "enviar" é privado e existe pelo efeito colateral (chamada HTTP), não
# por ser uma pergunta booleana — o bool de retorno é só o resultado da
# chamada, igual ao par público #enviar_documento (que a cop não
# reclama, provavelmente por ter um rescue no corpo).
Naming/PredicateMethod:
  AllowedMethods:
    - enviar

# Controllers/helpers/services deste projeto fazem algumas ações Rails
# "normais" (montar filtro+ordenação+paginação, montar linhas de tabela de
# PDF) que passam pouco dos limites padrão sem serem, de fato, confusos ou
# difíceis de ler — nenhum caso aqui chega perto de precisar virar vários
# objetos. Os números abaixo cobrem o pior caso já visto no projeto
# (dashboard_controller#index, semanal_pdf#tabela_demandas), sem abrir mão
# do cop pros métodos realmente grandes que possam aparecer depois.
Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Max: 33

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/PerceivedComplexity:
  Max: 10

# Rake tasks tendem a ser um pouco mais longas por natureza (setup
# procedural, sem que extrair métodos privados ajudaria muito — ver
# lib/tasks/telegram_notifications.rake).
Metrics/BlockLength:
  Exclude:
    - "lib/tasks/**/*.rake"

# Cop novo (rubocop-rails 2.29) com autocorreção marcada como insegura
# (SafeAutoCorrect: false) — troca params.require(...).permit(...) e
# params[:id] por params.expect(...), que tem semântica diferente (rejeita
# formato inesperado em vez de simplesmente não encontrar a chave). Vale
# adotar, mas é mudança de comportamento em código de parâmetros de
# requisição — trocar junto com o resto do backlog de estilo (que é só
# formatação) misturaria as duas coisas num commit que devia ser só
# cosmético. Fica pra revisar isoladamente, com os specs de request como
# rede de segurança.
Rails/StrongParametersExpect:
  Enabled: false

# Api::V1::BaseController herda de ActionController::Base direto, não de
# ApplicationController, de propósito — ver o comentário no topo da
# classe: ela reimplementa authenticate_user!/rescue_from CanCan por si
# só porque é uma API JSON enxuta, isolada dos concerns da parte web
# (Paginatable, respond_to html/json do rescue_from de
# ApplicationController). Herdar de ApplicationController deixaria de
# ser só estilo — misturaria os dois de novo.
Rails/ApplicationController:
  Exclude:
    - "app/controllers/api/v1/base_controller.rb"
