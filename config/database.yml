default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "task_keeper_api_development") %>

# Atenção: o banco "test" é apagado e recriado a cada `bundle exec rspec`
# (via `ActiveRecord::Migration.maintain_test_schema!`, ver
# spec/rails_helper.rb) — nunca aponte para o mesmo banco do development.
test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "task_keeper_api_test" } %>

# Em produção, prioriza DATABASE_URL — é o que o Railway (e a maioria dos
# provedores) já injeta automaticamente ao anexar um serviço de
# PostgreSQL. Sem DATABASE_URL definida, monta a URL a partir das mesmas
# variáveis individuais usadas em desenvolvimento/teste (útil pro
# docker-compose local, que sobe seu próprio serviço de banco).
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"].presence || "postgresql://#{ENV.fetch('DB_USERNAME', 'postgres')}:#{ENV.fetch('DB_PASSWORD', 'postgres')}@#{ENV.fetch('DB_HOST', 'localhost')}:#{ENV.fetch('DB_PORT', 5432)}/#{ENV.fetch('DB_NAME', 'task_keeper_api_production')}" %>
