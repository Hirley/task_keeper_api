name: CI

on:
  push:
    branches: [main]
    # Tag de release (v1.2.3) dispara o CI inteiro de novo — e é isso que
    # faz a imagem sair com a tag da versão (ver o job "docker" abaixo).
    # Rodar lint e testes de novo aqui não é redundância inútil: a tag pode
    # ser criada sobre um commit antigo, e o que interessa é que o código
    # daquele ponto passa, não que o topo da main passava.
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RAILS_ENV: test
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  DB_NAME: task_keeper_api_test
  SECRET_KEY_BASE: ci-dummy-secret-key-base-not-used-outside-ci

jobs:
  rubocop:
    name: Rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false

      - name: Adiciona plataforma linux ao Gemfile.lock
        run: bundle lock --add-platform x86_64-linux

      - name: Instala as gems
        run: bundle install --jobs 4 --retry 3

      - name: Rubocop
        run: bundle exec rubocop

  rspec:
    name: RSpec
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_keeper_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false

      - name: Adiciona plataforma linux ao Gemfile.lock
        run: bundle lock --add-platform x86_64-linux

      - name: Instala as gems
        run: bundle install --jobs 4 --retry 3

      - name: Prepara o banco de dados
        run: bin/rails db:prepare

      - name: Zeitwerk check (eager load isolado, fora do processo do RSpec)
        run: bin/rails zeitwerk:check

      - name: RSpec
        run: bundle exec rspec

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: [rubocop, rspec]
    # Só precisa de permissão de escrita no registry (packages: write) para
    # publicar; em pull_request isso fica sem efeito (push abaixo é false),
    # então não é um risco de PR de fork conseguir publicar imagem.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Só publica quando o CI roda por push (ex.: merge em main) — em
      # pull_request o job continua só validando que o Dockerfile builda,
      # sem publicar imagem de branch/fork ainda não revisado.
      - name: Login no GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action normaliza owner/repo pra minúsculas (exigido
      # pelo GHCR) e decide as tags conforme o que disparou o build:
      #
      #   * "latest" — só no topo da main. É uma tag que se move, então
      #     serve pra "me dá a última", nunca pra fixar uma versão.
      #
      #     Manter o "latest" fora dos builds de tag exigiu fechar DUAS
      #     portas, e a segunda só apareceu depois que a primeira foi
      #     fechada e o "latest" continuou saindo:
      #
      #       1. a condição desta regra é uma comparação explícita de ref,
      #          e não o {{is_default_branch}} do metadata-action — essa
      #          expressão também vale TRUE em push de tag (o README da
      #          action diz que "Git tag is also considered as default
      #          branch");
      #       2. o `flavor: latest=false` acima, porque o default
      #          "latest=auto" acrescenta a tag por fora destas regras.
      #
      #     Marcar um commit antigo com as duas portas abertas faria o
      #     "latest" regredir para uma imagem velha, em silêncio;
      #   * SHA completo — sempre, em qualquer disparo. É a única tag que
      #     identifica exatamente um commit;
      #   * semver — só em push de tag v*. "2.0.0" fixa a release; "2.0"
      #     acompanha as correções dentro daquele minor. Não geramos a tag
      #     de major sozinho ("2") de propósito: num projeto que ainda muda
      #     de comportamento entre minors, uma tag tão larga promete mais
      #     estabilidade do que existe.
      - name: Metadados da imagem (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # O default é "latest=auto", que acrescenta "latest" sozinho em
          # toda tag semver — por FORA das regras de `tags:` abaixo. Foi o
          # que reescreveu o "latest" nos builds da v2.0.0 e da v2.0.1,
          # mesmo com a regra type=raw já avaliando enable=false na v2.0.1
          # (dá pra ver no log do job: "type=raw,value=latest,enable=false"
          # e, logo abaixo, "Processing flavor input / latest=auto").
          #
          # Com latest=false, a única coisa capaz de gerar "latest" passa a
          # ser a regra explícita logo abaixo — que só vale no default branch.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build da imagem (publica só em push; em pull_request só valida o build)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
