name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RAILS_ENV: test
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  DB_NAME: task_keeper_api_test
  SECRET_KEY_BASE: ci-dummy-secret-key-base-not-used-outside-ci

jobs:
  rubocop:
    name: Rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false

      - name: Adiciona plataforma linux ao Gemfile.lock
        run: bundle lock --add-platform x86_64-linux

      - name: Instala as gems
        run: bundle install --jobs 4 --retry 3

      - name: Rubocop
        run: bundle exec rubocop

  rspec:
    name: RSpec
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_keeper_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false

      - name: Adiciona plataforma linux ao Gemfile.lock
        run: bundle lock --add-platform x86_64-linux

      - name: Instala as gems
        run: bundle install --jobs 4 --retry 3

      - name: Prepara o banco de dados
        run: bin/rails db:prepare

      - name: Zeitwerk check (eager load isolado, fora do processo do RSpec)
        run: bin/rails zeitwerk:check

      - name: RSpec
        run: bundle exec rspec

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: [rubocop, rspec]
    # Só precisa de permissão de escrita no registry (packages: write) para
    # publicar; em pull_request isso fica sem efeito (push abaixo é false),
    # então não é um risco de PR de fork conseguir publicar imagem.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Só publica quando o CI roda por push (ex.: merge em main) — em
      # pull_request o job continua só validando que o Dockerfile builda,
      # sem publicar imagem de branch/fork ainda não revisado.
      - name: Login no GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action normaliza owner/repo pra minúsculas (exigido
      # pelo GHCR) e gera as tags: "latest" (default branch) + o SHA do
      # commit, pra sempre dar pra apontar exatamente qual build está rodando.
      - name: Metadados da imagem (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build da imagem (publica só em push; em pull_request só valida o build)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
