name: CI

on:
  push:
    branches: [main]
  pull_request:

# NOTA: este projeto está pinado em Ruby 4.0.6 (ver Gemfile/.ruby-version).
# Se a `ruby/setup-ruby` usada abaixo ainda não tiver um build publicado
# para essa versão no momento em que este workflow rodar, o job falha na
# etapa "Set up Ruby" — não é um problema deste workflow, é a mesma
# limitação de versão de Ruby já documentada no restante do projeto (ver
# claude/redesign-ui-cge.md). Se isso acontecer, ajuste `ruby-version`
# aqui e em `.ruby-version`/Gemfile para a versão real disponível.

jobs:
  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec rubocop

  rspec:
    name: RSpec
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Preparar banco de dados
        run: bin/rails db:prepare
      - name: Rodar RSpec
        run: bundle exec rspec
