# Sobe a imagem de produção (mesmo Dockerfile do deploy) + um banco
# PostgreSQL local — não é um ambiente de desenvolvimento com hot-reload
# (pra isso, continue usando `bundle install && bin/rails server`, como
# descrito no README, apontando pra um Postgres local ou pro serviço "db"
# abaixo).
#
# Uso (sem nenhum passo manual — já sobe com um SECRET_KEY_BASE padrão
# pra uso local/demo, ver o default abaixo):
#   docker compose up --build
#
# Os dados do Postgres ficam num volume nomeado (tk_pgdata), então
# sobrevivem a `docker compose down` (mas não a `docker compose down -v`).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-task_keeper_api_production}
    volumes:
      - tk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        RUBY_VERSION: ${RUBY_VERSION:-4.0.6}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Só serve pra rodar local/demo sem passo manual — em produção de
      # verdade, defina SECRET_KEY_BASE de verdade via variável de
      # ambiente/.env (ver README, seção "Docker"), nunca reaproveite este
      # valor.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-507f0ac1cad395ebf59321b19903ca5926a5fda68872d87ef9a6106d83ec4ac5a09de644578b7ac2d8c531623d2940a9301fe030f441cced29da4fcd9a662500}
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-task_keeper_api_production}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      APP_HOST: ${APP_HOST:-localhost}
    volumes:
      - tk_log:/rails/log
    depends_on:
      db:
        condition: service_healthy

volumes:
  tk_pgdata:
  tk_log:
