# Sobe a imagem de produção (mesmo Dockerfile do deploy) + um banco
# PostgreSQL local — não é um ambiente de desenvolvimento com hot-reload
# (pra isso, continue usando `bundle install && bin/rails server`, como
# descrito no README, apontando pra um Postgres local ou pro serviço "db"
# abaixo).
#
# Uso (sem nenhum passo manual — sem SECRET_KEY_BASE definido, o
# entrypoint gera uma chave efêmera pra execução; ver bin/docker-entrypoint):
#   docker compose up --build
#
# São três serviços: o banco, o web (Puma) e o worker (Solid Queue). O
# worker é processo separado de propósito — é o que faz um job sobreviver
# a um restart do web, que era justamente o que o adapter :async não
# fazia. Ver config/environments/production.rb.
#
# Os dados do Postgres ficam num volume nomeado (tk_pgdata), então
# sobrevivem a `docker compose down` (mas não a `docker compose down -v`).

# Build e ambiente ficam em âncoras porque web e worker precisam ser
# idênticos: rodam o mesmo código, contra o mesmo banco. Duas listas
# separadas divergiriam na primeira variável nova que alguém esquecesse
# de copiar — e o sintoma seria um job se comportando diferente da tela.
x-app-build: &app-build
  context: .
  args:
    RUBY_VERSION: ${RUBY_VERSION:-4.0.6}

# Nome da imagem que web e worker usam. Com `--build` o compose builda e
# marca a imagem com este nome; sem `--build`, ele reaproveita uma imagem
# já existente com esse nome em vez de buildar.
#
# É esse segundo comportamento que o smoke test do CI usa: lá a imagem já
# foi buildada pelo passo anterior do job (com cache), e APP_IMAGE aponta
# pra ela — buildar de novo aqui dobraria o tempo do job pra produzir
# exatamente o mesmo artefato. Ver .github/workflows/ci.yml.
#
# Efeito colateral local: se você já tem uma task-keeper-api:local antiga
# e roda `docker compose up` sem `--build`, sobe a antiga. O README manda
# usar `--build`, que é o que resolve.
x-app-image: &app-image ${APP_IMAGE:-task-keeper-api:local}

x-app-env: &app-env
  # Sem valor default de propósito: quando esta variável chega vazia,
  # bin/docker-entrypoint gera uma chave efêmera só para a execução
  # (ver o comentário lá, que explica por que uma chave fixa aqui era
  # perigosa). Em produção de verdade, defina via .env — ver README,
  # seção "Docker".
  #
  # Vazia, web e worker geram chaves DIFERENTES. Não afeta os jobs de
  # hoje (os argumentos são valores simples, que o Active Job não
  # assina), mas é mais um motivo para definir a variável num deploy de
  # verdade.
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
  # Servido em http://localhost — sem TLS, então o redirect do
  # force_ssl deixaria a demo inacessível. Num deploy de verdade essa
  # variável não é definida, e o default de production.rb (ligado)
  # vale. Ver config/environments/production.rb.
  FORCE_SSL: ${FORCE_SSL:-false}
  # Vazio = ligado (default do entrypoint), que é o que mantém o
  # `docker compose up` sem passo manual. Defina "false" para exercitar
  # aqui o modo de produção: migrations numa etapa de release separada,
  # antes de subir o web. Ver bin/docker-entrypoint e o README.
  DB_PREPARE_ON_BOOT: ${DB_PREPARE_ON_BOOT:-}
  DB_HOST: db
  DB_PORT: 5432
  DB_USERNAME: ${DB_USERNAME:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  DB_NAME: ${DB_NAME:-task_keeper_api_production}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
  APP_HOST: ${APP_HOST:-localhost}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-task_keeper_api_production}
    volumes:
      - tk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: *app-build
    image: *app-image
    ports:
      - "${PORT:-3000}:3000"
    environment: *app-env
    volumes:
      - tk_log:/rails/log
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: *app-build
    image: *app-image
    command: ["./bin/jobs"]
    environment: *app-env
    volumes:
      - tk_log:/rails/log
    # O HEALTHCHECK do Dockerfile faz um curl na porta 3000 — faz sentido
    # pro web, não pro worker, que não serve HTTP nenhum. Sem desligar,
    # ele ficaria eternamente "unhealthy" por não responder algo que nem
    # deveria responder.
    healthcheck:
      disable: true
    # Espera o web ficar SAUDÁVEL, e não só o banco: é o entrypoint do
    # web que roda `db:prepare` (ver bin/docker-entrypoint). Subir antes
    # disso faria o worker procurar as tabelas solid_queue_* que ainda
    # não existem. É também o motivo de o worker não rodar migration
    # nenhuma: dois processos preparando o mesmo banco ao mesmo tempo é
    # corrida, não redundância.
    depends_on:
      web:
        condition: service_healthy

volumes:
  tk_pgdata:
  tk_log:
